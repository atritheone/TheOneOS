set timeout=0
set default=0

menuentry "The One OS" --id t1os {
    linux /boot/vmlinuz \
        init=/init \
        root=UUID=@T1OS_ROOT_UUID@ rootwait rw rootfstype=ext4 \
        t1os.developer=1 \
        tsc=unstable clocksource=hpet \
        video=Virtual-1:2560x1440-32@60 \
        vt.global_cursor_default=0 \
        console=ttyS0,115200n8 earlycon=uart8250,io,0x3f8,115200n8 loglevel=7
    initrd /boot/initramfs
}
