set timeout_style=menu
set timeout=5
set default=t1os-encrypted-boot

insmod part_gpt
insmod fat
insmod ntfs

if loadfont $prefix/fonts/unicode.pf2; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    set theme=$prefix/t1os-theme.txt
fi

menuentry "boot" --id t1os-encrypted-boot {
    linux /boot/vmlinuz-hardware \
        init=/init \
        rd.luks.uuid=@T1OS_LUKS_UUID@ t1os.luks.name=t1os-root root=/dev/mapper/t1os-root \
        t1os.recoverypart=SCAN t1os.esppart=UUID=@T1OS_ESP_UUID@ \
        t1os.recovery.sha256=@T1OS_RECOVERY_SHA256@ t1os.recovery.bytes=@T1OS_RECOVERY_BYTES@ t1os.rootlabel=@T1OS_ROOT_LABEL_TOKEN@ \
        t1os.roothealth.serial=@T1OS_ROOTHEALTH_SERIAL@ t1os.roothealth.uuid=@T1OS_ROOTHEALTH_UUID@ t1os.roothealth.record=@T1OS_ROOTHEALTH_RECORD@ \
        rootwait rw rootfstype=ntfs3 t1os.rootwait=60 \
        t1os.graphics=auto t1os.quiet=1 \
        nvidia_drm.modeset=1 nvidia_drm.fbdev=1 vt.global_cursor_default=0 \
        nouveau.config=NvGspFw=0 \
        console=ttyS0,115200n8 quiet loglevel=0 logo.nologo
    initrd /boot/initramfs-hardware
}

menuentry "safe mode" --id t1os-encrypted-safe {
    linux /boot/vmlinuz-hardware \
        init=/init \
        rd.luks.uuid=@T1OS_LUKS_UUID@ t1os.luks.name=t1os-root root=/dev/mapper/t1os-root \
        t1os.recoverypart=SCAN t1os.esppart=UUID=@T1OS_ESP_UUID@ \
        t1os.recovery.sha256=@T1OS_RECOVERY_SHA256@ t1os.recovery.bytes=@T1OS_RECOVERY_BYTES@ t1os.rootlabel=@T1OS_ROOT_LABEL_TOKEN@ \
        t1os.roothealth.serial=@T1OS_ROOTHEALTH_SERIAL@ t1os.roothealth.uuid=@T1OS_ROOTHEALTH_UUID@ t1os.roothealth.record=@T1OS_ROOTHEALTH_RECORD@ \
        rootwait rw rootfstype=ntfs3 t1os.rootwait=60 \
        t1os.graphics=framebuffer \
        module_blacklist=amdgpu,radeon,nouveau,nvidia,nvidia_modeset,nvidia_drm,nvidia_uvm,nvidia_peermem,i915,xe,ast,mgag200,qxl,bochs_drm,vmwgfx,virtio_gpu \
        vt.global_cursor_default=0 \
        console=tty0 console=ttyS0,115200n8 loglevel=7
    initrd /boot/initramfs-hardware
}

menuentry "recovery" --id t1os-encrypted-recovery {
    linux /boot/vmlinuz-hardware \
        init=/init \
        rd.luks.uuid=@T1OS_LUKS_UUID@ t1os.luks.name=t1os-root root=/dev/mapper/t1os-root \
        t1os.recoverypart=SCAN t1os.esppart=UUID=@T1OS_ESP_UUID@ \
        t1os.recovery.sha256=@T1OS_RECOVERY_SHA256@ t1os.recovery.bytes=@T1OS_RECOVERY_BYTES@ t1os.rootlabel=@T1OS_ROOT_LABEL_TOKEN@ \
        t1os.roothealth.serial=@T1OS_ROOTHEALTH_SERIAL@ t1os.roothealth.uuid=@T1OS_ROOTHEALTH_UUID@ t1os.roothealth.record=@T1OS_ROOTHEALTH_RECORD@ \
        rootwait ro rootfstype=ntfs3 t1os.rootwait=60 \
        t1os.graphics=cpu t1os.recovery=1 \
        module_blacklist=amdgpu,nouveau,nvidia,nvidia_drm \
        console=tty0 console=ttyS0,115200n8 loglevel=7
    initrd /boot/initramfs-hardware
}
