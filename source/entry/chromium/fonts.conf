<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Chromium is intentionally isolated from a conventional Linux root. Keep
    its complete font policy in this file instead of including host settings.
  -->
  <dir>/the one/software/chromium/resources/fonts</dir>
  <cachedir>/the one/settings/chromium/font-cache</cachedir>

  <!-- Browser and CSS generic families. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Arimo</family>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Tinos</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Cousine</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>cursive</family>
    <prefer>
      <family>Noto Sans</family>
      <family>FreeSans</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>fantasy</family>
    <prefer>
      <family>Noto Sans Display</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Chromium UI and common website system-font stacks. -->
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Roboto</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Ubuntu</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Cantarell</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>

  <!-- Metric-compatible substitutions used by Chromium and web content. -->
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial Unicode MS</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times</family>
    <prefer><family>Tinos</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Tinos</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier</family>
    <prefer><family>Cousine</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier New</family>
    <prefer><family>Cousine</family></prefer>
  </alias>

  <!--
    Unknown local families must not collapse to the first scanned serif face.
    Web fonts remain first in the pattern; this list is only their fallback.
  -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans</string>
      <string>Noto Color Emoji</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols 2</string>
    </edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <config>
    <rescan><int>0</int></rescan>
  </config>
</fontconfig>
